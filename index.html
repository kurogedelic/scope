<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>scope</title><link rel="stylesheet" href="style.css"></head><body><main><div id="stage"><canvas id="scope"></canvas></div><section id="bar"><button id="play">PLAY</button><button id="scoreBtn">SCORE</button><button id="random">MUTATE</button><span id="status">168 BPM</span></section><section id="scorePanel"><textarea id="score" spellcheck="false">@168
